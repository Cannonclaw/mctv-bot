<!doctype html>
<!--
  MCTV RATE PAGE REDIRECT — 2026-09-20

  This file used to be a second full copy of the rate calculator, including the
  venue table: every client venue with its city, screen count, venue type and
  monthly traffic figure, readable from the page source. It also priced premium
  contract venues off the same $175 per-venue soft cap the terminal was quoted
  well above.

  Creed's call on 2026-09-20 was to take the calculator down. mctvofms.com/rate-quote/
  is now the one rate page: network packages only, no venue roster, no per-venue
  pricing. Keeping a second copy here is what let the two drift apart in the first
  place, so this redirects instead of duplicating.

  The query string carries over, so quote links a rep already sent (?pkg=p75&terr=…)
  still land on a prefilled quote.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MCTV Elite Advertising — Rates</title>
<link rel="canonical" href="https://mctvofms.com/rate-quote/">
<meta http-equiv="refresh" content="0; url=https://mctvofms.com/rate-quote/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#faf8f3;color:#00377e;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .b{max-width:30rem;padding:2rem 1.5rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .5rem}
  p{color:#5a6b7c;margin:0 0 1.25rem}
  a.go{display:inline-block;padding:.75rem 1.5rem;border-radius:.625rem;
       background:#00377e;color:#fff;text-decoration:none;font-weight:700}
  a.go:hover{background:#002a5e}
</style>
</head>
<body>
<div class="b">
  <h1>MCTV rates have moved</h1>
  <p>Our rate page now lives on the main site.</p>
  <p><a class="go" id="go" href="https://mctvofms.com/rate-quote/">Open the rate page</a></p>
  <p style="font-size:.875rem">Questions? Call Creed Cannon at
     <a href="tel:+16012018202" style="color:#00377e">601-201-8202</a>.</p>
</div>
<script>
  // Carry any ?pkg= / ?terr= / ?months= prefill through to the canonical page so
  // quote links already in circulation keep working.
  (function () {
    var target = 'https://mctvofms.com/rate-quote/' + (location.search || '');
    document.getElementById('go').href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
