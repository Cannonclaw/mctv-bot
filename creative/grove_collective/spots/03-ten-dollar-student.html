<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Grove Collective — Ten Dollar Student (:15)</title>
    <link rel="stylesheet" href="../lib/brand.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import {
        Spot,
        el,
        seg,
        tw,
        band,
        clamp,
        lerp,
        ease,
        splitChars,
        bindPhoto,
      } from "../lib/spot-engine.js";
      import {
        stadiumLights,
        crowd,
        atmosphere,
        endcard,
        lockup,
      } from "../lib/scene.js";
      import { impact, chip } from "../lib/fx.js";

      /* SPOT 03 — "TEN DOLLARS"  :15 / 1920x1080 / silent
         ------------------------------------------------------------------
         The student spot. Faster cuts, hotter type, one joke that lands in
         under two seconds. Built for the Oxford screens where the student
         membership actually converts. Do not buy this one outside Oxford.

         Punch-up: the $10 lands with a hit at 0.3s into a lit stadium
         (banks snapping on as it arrives), then STAYS on screen — anchored
         right — while the strike ledger runs down the left half. Strikes
         tilt, accelerate, and dead lines recede. The payoff line doubled in
         mass and the world ignites red under it.

           0.0 - 2.2   OLE MISS STUDENTS / $10 A MONTH   <- the land
           2.2 - 8.6   ledger left, price holds right
           8.6 - 11.6  OR YOU'RE IN THE COLLECTIVE.
          11.6 - 15.0  Lockup + CTA + MCTV endcard

         PHOTO SLOTS (see README):
           student-wide  1920x1080 full bleed, behind the strike list
           lock-band     1920x520  behind the closing lockup          */

      const STRIKES = [
        "TWO COFFEES.",
        "ONE COVER CHARGE.",
        "HALF A LATE-NIGHT PIZZA.",
      ];
      const TILTS = [-1.2, 0.8, -1.8];
      const CUTS = [{ t: 0.3, k: 0.8 }, 2.2, { t: 8.6, color: "red", k: 1.3 }, 11.6];

      new Spot({
        duration: 15,
        fps: 30,
        build(stage) {
          /* -------------------------------------------------- backdrop -- */
          const slotWide = el("div", "photo-slot", stage, {
            inset: "0",
            zIndex: "1",
            opacity: "0",
          });
          slotWide.dataset.slot = "student-wide";
          bindPhoto(slotWide, window.PHOTOS?.["student-wide"], "50% 40%");

          const lights = stadiumLights(stage);
          const bowl = crowd(stage, { seed: 91177, zIndex: 3 });
          const air = atmosphere(stage, { zIndex: 40 });

          /* --------------------------------------- beat 1: the price --- */
          const beat1 = el("div", "center", stage, { zIndex: 22 });
          const k1 = chip(beat1, "OLE MISS STUDENTS");
          const priceRow = el("div", null, beat1, {
            display: "flex",
            alignItems: "flex-start",
            justifyContent: "center",
            marginTop: "24px",
          });
          const dollar = el("div", "headline", priceRow, {
            fontSize: "170px",
            color: "var(--powder)",
            marginTop: "52px",
            marginRight: "6px",
          });
          dollar.textContent = "$";
          const price = el("div", "headline", priceRow, {
            fontSize: "500px",
            color: "var(--white)",
            lineHeight: "0.8",
          });
          price.textContent = "10";
          const priceSub = el("div", "sub", beat1, {
            fontSize: "56px",
            marginTop: "22px",
            color: "var(--powder)",
          });
          priceSub.textContent = "A MONTH";

          /* --------------------- beat 2: ledger left, price holds right -- */
          /* The offer never leaves the screen: a persistent $10 anchors the
             right half while the ledger kills comparisons on the left. */
          const holdPrice = el("div", null, stage, {
            position: "absolute",
            right: "150px",
            top: "50%",
            transform: "translateY(-50%)",
            zIndex: "22",
            display: "flex",
            alignItems: "flex-start",
            opacity: "0",
          });
          const holdDollar = el("div", "headline", holdPrice, {
            fontSize: "110px",
            color: "var(--powder)",
            marginTop: "34px",
            marginRight: "4px",
          });
          holdDollar.textContent = "$";
          const holdNum = el("div", "headline", holdPrice, {
            fontSize: "330px",
            color: "var(--white)",
            lineHeight: "0.8",
          });
          holdNum.textContent = "10";

          const ledgerScrim = el("div", null, stage, {
            position: "absolute",
            left: "0",
            top: "160px",
            bottom: "160px",
            width: "1050px",
            zIndex: "21",
            background:
              "linear-gradient(to right, rgba(5,12,29,0.72) 55%, transparent)",
            opacity: "0",
            pointerEvents: "none",
          });
          const listWrap = el("div", null, stage, {
            position: "absolute",
            left: "150px",
            top: "50%",
            transform: "translateY(-50%)",
            zIndex: "22",
            textAlign: "left",
          });
          const listKicker = el("div", "sub", listWrap, {
            fontSize: "46px",
            fontWeight: "700",
            color: "var(--white)",
            marginBottom: "30px",
          });
          listKicker.textContent = "WHAT THAT BUYS";
          const lines = STRIKES.map((text, i) => {
            const row = el("div", null, listWrap, {
              position: "relative",
              display: "inline-block",
              margin: "24px 0",
              transform: `rotate(${TILTS[i]}deg)`,
            });
            const label = el("div", "headline", row, {
              fontSize: "96px",
              color: "var(--white)",
              whiteSpace: "nowrap",
            });
            label.textContent = text;
            /* The strike rule wipes across from the left as each line dies. */
            const strike = el("div", null, row, {
              position: "absolute",
              left: "-14px",
              right: "-14px",
              top: "52%",
              height: "12px",
              background: "var(--red-hot)",
              transformOrigin: "left center",
              boxShadow: "0 0 26px rgba(232,36,58,0.75)",
            });
            return { row, label, strike, tilt: TILTS[i] };
          });

          /* ------------------------------------------------- beat 3 ---- */
          const scrim3 = el("div", null, stage, {
            position: "absolute",
            inset: "0",
            zIndex: "23",
            background:
              "radial-gradient(ellipse 62% 46% at 50% 50%, rgba(5,12,29,0.5), transparent 70%)",
            opacity: "0",
            pointerEvents: "none",
          });
          const beat3 = el("div", "center", stage, { zIndex: 24 });
          const l3 = el("div", "headline", beat3, {
            fontSize: "148px",
            color: "var(--white)",
          });
          const c3 = splitChars(l3, "OR YOU'RE IN");
          const l3b = el("div", "headline", beat3, {
            fontSize: "236px",
            color: "var(--red-hot)",
            marginTop: "8px",
          });
          const c3b = splitChars(l3b, "THE COLLECTIVE.");

          /* -------------------------------------------------- lockup --- */
          const slotLock = el("div", "photo-slot photo-slot--band", stage, {
            left: "0",
            right: "0",
            top: "280px",
            height: "520px",
            zIndex: "25",
          });
          slotLock.dataset.slot = "lock-band";
          bindPhoto(slotLock, window.PHOTOS?.["lock-band"], "50% 42%");

          const lock = lockup(stage, {
            at: 11.6,
            kicker: "STUDENT MEMBERSHIP",
            cta: "STUDENTS JOIN FOR $10 / MONTH",
          });

          const end = endcard(stage, { at: 12.0 });
          const hit = impact(stage, stage);

          /* ================================================== timeline == */
          return (t) => {
            /* The stadium is ALIVE from the open — banks snap on as the
               price arrives, and the bowl sits half full the whole way. */
            const power = clamp(seg(t, 0.2, 1.4) * 0.85 + seg(t, 8.6, 10.2) * 0.15);
            const heat = clamp(seg(t, 8.6, 9.6)) * (1 - seg(t, 12.4, 13.4) * 0.5);
            const bp =
              t < 2.0
                ? [
                    seg(t, 0.2, 0.34),
                    seg(t, 0.45, 0.6),
                    seg(t, 0.7, 0.85),
                    seg(t, 0.95, 1.1),
                  ]
                : null;
            lights.seek(t, power, bp, heat);
            air.seek(t, power);

            const fill = clamp(0.5 * seg(t, 0.3, 1.6) + 0.5 * seg(t, 8.6, 11.0));
            const energy = clamp(
              Math.max(0.35, lerp(0.4, 1, seg(t, 8.8, 9.6)) - seg(t, 12.4, 13.4) * 0.4)
            );
            bowl.seek(t, fill, energy);
            bowl.node.style.opacity = String(1 - seg(t, 12.4, 13.2) * 0.25);

            if (slotWide.dataset.filled !== undefined) {
              slotWide.style.opacity = String(clamp(0.8 - seg(t, 11.6, 12.2) * 0.8));
              slotWide.style.transform = `scale(${tw(t, 0, 15, 1.06, 1.16, ease.linear)})`;
            }

            /* ---- beat 1: the number LANDS at 0.3 --------------------- */
            const b1 = band(t, 0.15, 2.2, 0.2);
            beat1.style.opacity = String(b1);
            k1.style.opacity = String(seg(t, 0.15, 0.45));
            price.style.transform = `scale(${tw(t, 0.3, 0.65, 1.5, 1, ease.outQuint)})`;
            dollar.style.transform = `scale(${tw(t, 0.38, 0.73, 1.5, 1, ease.outQuint)})`;
            priceSub.style.opacity = String(seg(t, 0.9, 1.3));

            /* ---- beat 2: ledger + persistent price ------------------- */
            const b2 = band(t, 2.2, 8.6, 0.2);
            listWrap.style.opacity = String(b2);
            ledgerScrim.style.opacity = String(b2);
            holdPrice.style.opacity = String(b2);
            listKicker.style.opacity = String(seg(t, 2.3, 2.7));
            lines.forEach((line, i) => {
              /* Kills accelerate: 0.5s, then 0.4s, then 0.3s. */
              const t0 = 2.5 + i * 1.75;
              const strikeDur = 0.5 - i * 0.1;
              const inP = seg(t, t0, t0 + 0.4);
              const strikeP = seg(t, t0 + 0.85, t0 + 0.85 + strikeDur);
              line.row.style.opacity = String(inP);
              line.row.style.transform = `rotate(${line.tilt}deg) translate3d(${lerp(
                -70,
                0,
                ease.out(inP)
              )}px, 0, 0) scale(${lerp(1, 0.92, strikeP)})`;
              line.strike.style.transform = `scaleX(${ease.out(strikeP)})`;
              /* Dead lines recede hard so the live one always dominates. */
              line.label.style.opacity = String(lerp(1, 0.32, strikeP));
            });

            /* ---- beat 3 --------------------------------------------- */
            const b3 = band(t, 8.6, 11.8, 0.2);
            beat3.style.opacity = String(b3);
            scrim3.style.opacity = String(b3);
            c3.forEach((ch, i) => {
              const p = seg(t, 8.6 + i * 0.022, 8.98 + i * 0.022);
              ch.style.transform = `translate3d(0, ${lerp(60, 0, ease.out(p))}px, 0)`;
              ch.style.opacity = String(clamp(p * 2.5));
            });
            /* Whole-line hit on top of the char stagger. */
            l3b.style.transform = `scale(${tw(t, 9.15, 9.75, 0.9, 1, ease.back)})`;
            c3b.forEach((ch, i) => {
              const p = seg(t, 9.1 + i * 0.024, 9.5 + i * 0.024);
              ch.style.transform = `translate3d(0, ${lerp(90, 0, ease.back(p))}px, 0)`;
              /* Red over navy must never sit half-transparent — snap it. */
              ch.style.opacity = String(clamp(p * 2.5));
            });

            /* ---- lockup --------------------------------------------- */
            const bl = seg(t, 11.6, 12.1);
            slotLock.style.opacity = String(bl * 0.75);
            slotLock.style.transform = `scale(${tw(t, 11.6, 15, 1.04, 1.1, ease.linear)})`;
            lock.seek(t);

            end.seek(t);
            hit.seek(t, CUTS);
          };
        },
      }).mount();
    </script>
  </body>
</html>
